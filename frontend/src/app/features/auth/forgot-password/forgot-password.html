<div class="auth">
  <form class="card auth__card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="auth__brand">
      <span class="auth__mark" aria-hidden="true">₨</span>
      <span class="auth__name">Monefy</span>
    </div>

    <h1 class="auth__title">Reset your password</h1>
    <p class="auth__sub">We'll email you a link to set a new one.</p>

    <div class="auth__form">
      @if (error()) {
        <p class="auth__banner auth__banner--error">{{ error() }}</p>
      }
      @if (sent()) {
        <p class="auth__banner auth__banner--success">
          If that email has an account, a reset link is on its way.
        </p>
      }

      <div class="field">
        <label class="field__label" for="email">Email</label>
        <input
          id="email"
          class="input"
          type="email"
          autocomplete="email"
          formControlName="email"
          [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid"
        />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span class="field__error">Enter a valid email address.</span>
        }
      </div>

      <button class="btn btn--primary auth__submit" type="submit" [disabled]="busy()">
        {{ busy() ? 'Sending…' : 'Send reset link' }}
      </button>
    </div>

    <p class="auth__foot">
      <a class="auth__link" routerLink="/auth/login">Back to sign in</a>
    </p>
  </form>
</div>
